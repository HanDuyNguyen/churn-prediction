name: MLOps Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: churn-model-han-demo 

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Use built-in token

    # 1. Install uv and manage automatic caching
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true # Automated GitHub Actions caching
    
    # 2. Sync dependencies from your lockfile
    - name: Install dependencies
      run: uv sync --locked # Ensures the CI fails if the lockfile is out of sync

    - name: Generate dataset
      run: python generate_data.py
    
    - name: Train model
      run: python train.py
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Push model to S3 directly
      run: |
        aws s3 cp models/churn_model.pkl s3://churn-model-han-demo/models/churn_model.pkl
        echo "Model pushed to S3 is success"
